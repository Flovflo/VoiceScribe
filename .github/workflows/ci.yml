name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: "26.6"

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Swift version
        run: swift --version

      - name: Run tests
        # Xcode compiles MLX's matching Metal shaders; Swift 6.3's command-line
        # SwiftPM build does not. Never substitute a system-private metallib.
        run: |
          workspace="$RUNNER_TEMP/VoiceScribe-Package.xcworkspace"
          mkdir -p "$workspace"
          cat > "$workspace/contents.xcworkspacedata" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version="1.0">
            <FileRef location="absolute:$GITHUB_WORKSPACE"></FileRef>
          </Workspace>
          EOF
          xcodebuild test -workspace "$workspace" -scheme VoiceScribe -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/VoiceScribe-CI" CODE_SIGNING_ALLOWED=NO

      - name: Build release (arm64)
        run: swift build -c release --arch arm64
