name: Release preview validation

# Public releases are uploaded only after local Developer ID signing,
# notarization, stapling and Gatekeeper verification. CI previews cannot publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Preview version tag (e.g. v1.5.0); no public release is published"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: "26.6"
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Run tests
        run: swift test
      - name: Resolve preview version
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag."
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$TAG" "${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build unsigned preview DMG
        env:
          PREVIEW_TAG: ${{ steps.vars.outputs.tag }}
        run: ./scripts/build_dmg.sh "$PREVIEW_TAG"
      - name: Build unsigned preview ZIP
        env:
          PREVIEW_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          ZIP_PATH="dist/VoiceScribe-${PREVIEW_VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent VoiceScribe.app "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" | awk '{print $1}' > "$ZIP_PATH.sha256"
      - name: Upload unsigned preview artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VoiceScribe-${{ steps.vars.outputs.version }}-unsigned-preview
          path: |
            dist/VoiceScribe-${{ steps.vars.outputs.version }}.dmg
            dist/VoiceScribe-${{ steps.vars.outputs.version }}.dmg.sha256
            dist/VoiceScribe-${{ steps.vars.outputs.version }}.zip
            dist/VoiceScribe-${{ steps.vars.outputs.version }}.zip.sha256
